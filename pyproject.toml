[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "varwar"
version = "0.1.0"
description = "R&D harness for A/B estimator sensitivity and variance reduction experiments."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "hypex>=1.0.6,<1.1",
  "numpy>=1.24,<1.27",
  "pandas>=2.0,<2.3",
  "scipy>=1.10,<1.14",
  "matplotlib>=3.7,<3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
ml = [
  "scikit-learn>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
