[simulation]
n_trials = 200
n = 2500
alternative_effect = 0.15
covariate_signal = 0.75
noise_scale = 1.0
seed = 20260724
alpha = 0.05
scenario_ids = [
  "linear_gaussian",
  "linear_heavy_tail",
  "nonlinear_gaussian",
  "contaminated_c",
  "misclassified_b",
  "population_shifted_strata",
]
information_mode = "both"
panel_prior_months = 6
include_non_rct_specialized = false

[stratification]
enabled = true
category_cols = ["region", "device", "activity_band"]
n_strata = 6
population_size = 16
max_generations = 25
elite_size = 3
patience = 7
min_macro_stratum_size = 8
mutation_probability = 0.20

[runtime]
prefer_pypi_hypex = true

[output]
directory = "results/pipeline_race_v2"
