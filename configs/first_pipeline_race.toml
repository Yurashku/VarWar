[simulation]
n_trials = 100
n = 2000
alternative_effect = 0.15
covariate_signal = 0.75
noise_scale = 1.0
heavy_tail = false
seed = 20260715
alpha = 0.05

[stratification]
category_cols = ["region", "device", "activity_band"]
n_strata = 6
population_size = 16
max_generations = 25
elite_size = 3
patience = 7
min_macro_stratum_size = 8
mutation_probability = 0.20

[runtime]
prefer_pypi_hypex = true

[output]
directory = "results/first_pipeline_race"
